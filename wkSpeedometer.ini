; wkSpeedometer settings (all optional). Delete a line to use its default.
[wkSpeedometer]
; 1 = the module runs; 0 = it does nothing at all.
Enabled=1
; The speedometer (the speed of the worm whose turn it is, in pixels a second): dial, number or off.
; WA's top speed is 2263 px/s diagonally (1600 px/s straight down or across).
Speedometer=dial
; Where: corner (bottom right, above WA's wind bar) or worm (just above the worm's name).
SpeedometerPlace=corner
; The speed, in pixels a second, where the colours reach red (blue when slow, through cyan, green, yellow and orange).
RedFrom=800
; The movement line: when a worm's turn starts, a line shows where that worm has been.
; all = the whole game, its last turn bright; last = its last turn only; off = no line.
TurnLine=off
; 0 = the line goes as soon as the worm moves; 1 = it stays all turn.
TurnLineKeep=0
; The line's colour: speed = how fast the worm went there, in the speedometer's colours; red = all red.
TurnLineColour=speed
